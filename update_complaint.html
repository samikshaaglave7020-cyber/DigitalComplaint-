<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Update Complaint Status</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="container">

    <div class="logo-box">
        <img src="college_logo.png" alt="College Logo">
    </div>

    <h1>Pravara Rural Engineering College, Loni</h1>

    <h2>Information Technology Department</h2>

    <h3>Complaint Management System</h3>

    <hr>

    <h2>Update Complaint Status</h2>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Category</th>
                    <th>Complaint</th>
                    <th>Status</th>
                    <th>Update</th>
                </tr>
            </thead>

            <tbody id="complaintTable">
            </tbody>

        </table>

    </div>

    <br>

    <a href="index.html" class="btn view">
        Back to Home
    </a>

</div>


<script>

    // Get complaints from localStorage
    let complaints =
        JSON.parse(localStorage.getItem("complaints")) || [];

    const table =
        document.getElementById("complaintTable");


    // Display complaints
    function displayComplaints() {

        table.innerHTML = "";

        // No complaints
        if (complaints.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="4">
                        No complaints submitted.
                    </td>
                </tr>
            `;

            return;
        }


        // Display each complaint
        complaints.forEach(function(complaint, index) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${complaint.category || "Not Available"}
                </td>

                <td>
                    ${complaint.description || "Not Available"}
                </td>

                <td>
                    <select id="status-${index}">

                        <option value="Pending"
                            ${complaint.status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="In Progress"
                            ${complaint.status === "In Progress" ? "selected" : ""}>
                            In Progress
                        </option>

                        <option value="Resolved"
                            ${complaint.status === "Resolved" ? "selected" : ""}>
                            Resolved
                        </option>

                    </select>
                </td>

                <td>
                    <button onclick="updateStatus(${index})">
                        Update Status
                    </button>
                </td>

            `;


            table.appendChild(row);

        });

    }


    // Update complaint status
    function updateStatus(index) {

        const newStatus =
            document.getElementById("status-" + index).value;


        complaints[index].status = newStatus;


        // Save updated complaints
        localStorage.setItem(
            "complaints",
            JSON.stringify(complaints)
        );


        alert("Complaint status updated successfully!");


        // Refresh table
        displayComplaints();

    }


    displayComplaints();

</script>

</body></html>
